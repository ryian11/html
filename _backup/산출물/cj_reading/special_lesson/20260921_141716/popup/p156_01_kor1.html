  <div class="js-scale iframePopup" data-use="kor">
    <div class="popContentContainer">
      <!-- popHeader -->

        <div class="popHeaderInner">
          <h2 class="popHeaderTit">
            <span>해석</span>

      </header>
      <!-- popContentBox -->

        <!-- popContent -->

              <!-- Paragraph -->
              <div class="Paragraph">
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont src="../media/mp3/3_156_read_01.mp3" en="At dance class, there were many girls and boys whose feet never stopped moving, just like Diana." kr="댄스 수업에는 Diana처럼 발이 쉬지 않고 움직이는 소년 소녀들이 많이 있었다."></script-cont>
					<script-cont src="../media/mp3/3_156_read_02.mp3" en="She was too excited to stay calm." kr="그녀는 너무 신이<span style='left:-874px'>나서 차분히 있을 수가 없었다.</span>"></script-cont>
					<script-cont src="../media/mp3/3_156_read_03.mp3" en="When she started learning to dance, she felt so happy." kr="춤을 배우기 시작하자, 그녀는 매우 행복했다."></script-cont>
					<script-cont src="../media/mp3/3_156_read_04.mp3" en="She loved the moment when she could express herself freely." kr="그녀는 자신을 자유롭게 표현할 수 있는 순간을 사랑했다."></script-cont>
					<script-cont src="../media/mp3/3_156_read_05.mp3" en="She spent the whole week waiting for her next dance class." kr="그녀는 다음 댄스 수업을 기다리며 일주일을 보냈다."></script-cont>
					<script-cont scrollTop="509" src="../media/mp3/3_156_read_06.mp3" en="She practiced every day at home." kr="그녀는 집에서 매일 연습했다."></script-cont>
					<script-cont scrollTop="509" src="../media/mp3/3_156_read_07.mp3" en="She even danced while she solved math problems." kr="심지어 수학 문제를 푸는 동안에도 춤을 추었다."></script-cont>
					<script-cont scrollTop="509" src="../media/mp3/3_156_read_08.mp3" en="She discovered that it was easier for her to solve equations when she was moving." kr="그녀는 몸을 움직이고 있을 때 방정식을 푸는 것이 더 쉽다는 것을 발견했다."></script-cont>
					<script-cont scrollTop="509" src="../media/mp3/3_156_read_09.mp3" en="The more she moved, the better she understood math." kr="그녀가 더 많이 움직일수록, 그녀는<span style='left:-680px'>수학을 더 잘 이해했다.</span>"></script-cont>
					<script-cont scrollTop="509" src="../media/mp3/3_156_read_10.mp3" en="She practiced dancing every day so that she could do better in math, too." kr="그녀는 수학도 더 잘하기 위해 매일<span style='left:-668px'>춤을 연습했다.</span>"></script-cont>
