<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">

	<link rel="stylesheet" type="text/css" href="../include/css/common.css">
	<link rel="stylesheet" type="text/css" href="../include/css/listen_total.css">
	<title>p122_02_all</title>
	<style>
		.scriptContainer .scriptBox:not(.titBox, .subTitBox) .Script:first-of-type {
			margin-left: 20px;
		}
	</style>
</head>

<body>
	<div class="js-iframePopupContainer js-scale iframePopup" data-use="listenTotal">
		<div class="popContentContainer">
			<!-- popHeader -->
			<header class="popHeader">
				<div class="popHeaderInner">
					<h2 class="popHeaderTit">
						<span>본문 전체 듣기</span>
					</h2>

					<div class="btnBundle readAloudBox">
						<div class="readAloudTimer">
							<div class="js-toggleBtn timerBtnBox">
								<button class="js-timeStart timeStartBtn"></button>
								<button class="js-timeEnd timeEndBtn"></button>
							</div>

							<div class="timeBox js-timeBox">
								<span class="js-minute Min">00</span>
								<span class="Dot">:</span>
								<span class="js-second Sec">00</span>
							</div>
						</div>

						<!-- readAloud -->
						<div class="readAloudBtnBox">
							<button class="js-openPopBtn openPopBtn readAloudBtn" data-pop-idx="10"></button>
							<div class="js-popupContent miniPopup" data-pop-idx="10" data-use="readaloud">
								<div class="miniContent arrayV">
									<div class="js-timeCheck timeCheck" data-order="1">
										1st <span class="js-minute Min"></span> min. <span class="js-second Sec"></span> sec.
									</div>
									<div class="js-timeCheck timeCheck" data-order="2">
										2nd <span class="js-minute Min"></span> min. <span class="js-second Sec"></span> sec.
									</div>
									<p><span class="timeStartIcon"></span>버튼을 눌러 타이머를<br>시작/종료할 수 있습니다.</p>
								</div>
							</div>
						</div>
					</div>
				</div>
				<button class="js-closePopBtn closePopBtn"></button>
			</header>

			<!-- popContentBox -->
			<div class="popContentBox">
				<!-- popContent -->
				<div class="js-scrollContainer scrollContainer popContent" data-scroll-idx="0">
					<div class="js-player Player js-scrollBox scrollBox" data-ply-type="language" data-ply-controls="play, pause, stop, progress" data-ply-opts="speed" data-speed-btn="0.8,1.0,1.2,1.5" data-script-mode="toggle" data-ply-idx="2" data-scroll-idx="0">
						<!-- scriptContainer -->
						<div class="js-languageContainer scriptContainer" data-ply-idx="2">
							<!-- Paragraph -->
							<div class="Paragraph">
				<!-- titBox -->
				<comp-script-box class="titBox">
					<script-cont src="../media/mp3/3_122_read_00.mp3" en="James Webb Space Telescope" kr="제임스 웹 우주 망원경"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont src="../media/mp3/3_122_read_01.mp3" en="Today, I’m here to meet Dr. Jane Roman, a space scientist, to talk about the James Webb Space Telescope" kr="오늘 저는 우주 과학자인 Jane Roman 박사를 만나 제임스 웹 우주 망원경(JWST)에<span style='left:-20px'>대해 이야기하기 위해 이곳에 왔습니다.</span>"></script-cont>
					<script-cont src="../media/mp3/3_122_read_02.mp3" en="(JWST)." kr="해석x"></script-cont>
					<script-cont src="../media/mp3/3_122_read_03.mp3" en="Dr. Roman, I heard that it was launched on December 25, 2021." kr="Roman 박사님, 저는 그것이 2021년 12월 25일에 발사되었다고<span style='left:-154px'>들었습니다.</span>"></script-cont>
					<script-cont src="../media/mp3/3_122_read_04.mp3" en="Can you introduce the JWST?" kr="JWST를 소개해 주실 수 있나요?"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="549" src="../media/mp3/3_123_read_02.mp3" en="The JWST is the most powerful telescope in history." kr="JWST는 역사상 가장 강력한 망원경입니다."></script-cont>
					<script-cont scrollTop="549" src="../media/mp3/3_123_read_03.mp3" en="It’s as wide as a tennis court and as tall as a three-story building." kr="그것은<span style='left:-1079px'>테니스 코트만큼 넓고, 3층 건물만큼 높습니다.</span>"></script-cont>
					<script-cont scrollTop="549" src="../media/mp3/3_123_read_04.mp3" en="If a person stood next to the telescope, the person would look like a tiny ant." kr="만약 어떤 사람이 그 망원경 옆에 선다면, 그 사람은 아주 작은 개미처럼<span style='left:-187px'>보일 것입니다.</span>"></script-cont>
					<script-cont scrollTop="549" src="../media/mp3/3_123_read_05.mp3" en="To observe deep into space, it has 18 golden mirrors that work like one big eye." kr="우주 깊은 곳을 관측하기 위해, 그것은<span style='left:-670px'>하나의 큰 눈처럼 작동하는 18개의 금빛 거울을 가지고 있습니다.</span>"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="1069" src="../media/mp3/3_123_read_06.mp3" en="How did scientist launch such a large telescope into space?" kr="과학자들은 어떻게 그렇게 큰 망원경을 우주로 발사했나요?"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="1069" src="../media/mp3/3_123_read_07.mp3" en="We found the answer in paper folding." kr="우리는 종이접기에서 답을 찾았습니다."></script-cont>
					<script-cont scrollTop="1069" src="../media/mp3/3_123_read_08.mp3" en="The JWST was folded twelve times so that it could fit into a space rocket." kr="JWST는 우주 로켓에 꼭<span style='left:-800px'>들어맞도록 열두 번 접혔습니다.</span>"></script-cont>
					<script-cont scrollTop="1489" src="../media/mp3/3_123_read_09.mp3" en="Then the telescope traveled 1.5 million kilometers away from Earth." kr="그 후 망원경은 지구에서 150만 킬로미터 떨어진 곳까지 이동했습니다."></script-cont>
					<script-cont scrollTop="1489" src="../media/mp3/3_123_read_10.mp3" en="After the JWST was launched, it spent about a month traveling to its final location." kr="JWST가 발사된 후에, 최종 위치까지 도달하는 데 약 한 달이<span style='left:-351px'>걸렸습니다.</span>"></script-cont>
					<script-cont scrollTop="1489" src="../media/mp3/3_123_read_11.mp3" en="During this time, it was slowly unfolded, piece by piece, like a blooming flower." kr="이 시간 동안<span style='left:-892px'>망원경은 피어나는 꽃처럼, 조금씩 천천히 펼쳐졌습니다.</span>"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="2009" src="../media/mp3/3_124_read_01.mp3" en="Interesting" kr="흥미롭네요."></script-cont>
					<script-cont scrollTop="2009" src="../media/mp3/3_124_read_02.mp3" en="I heard that the JWST uses infrared cameras." kr="저는 JWST가 적외선 카메라를 사용한다고 들었습니다."></script-cont>
					<script-cont scrollTop="2009" src="../media/mp3/3_124_read_03.mp3" en="How does it work?" kr="그것은 어떻게 작동하나요?"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="2009" src="../media/mp3/3_124_read_04.mp3" en="Using infrared cameras is the special point of this telescope." kr="적외선 카메라를 사용하는 것이 이 망원경의 특별한 점입니다."></script-cont>
					<script-cont scrollTop="2009" src="../media/mp3/3_124_read_05.mp3" en="We cannot see infrared light, but we can feel it as heat." kr="우리는 적외선을 볼 수 없지만, 우리는 그것을 열로 느낄 수 있습니다."></script-cont>
					<script-cont scrollTop="2429" src="../media/mp3/3_124_read_06.mp3" en="With infrared cameras, the telescope can observe the infrared light from stars and planets far from Earth." kr="적외선 카메라로 망원경은 지구에서 멀리 떨어진 별과 행성에서 나오는<span style='left:-168px'>적외선을 관측할 수 있습니다.</span>"></script-cont>
					<script-cont scrollTop="2429" src="../media/mp3/3_124_read_07.mp3" en="It can even see through space dust or space clouds, which block visible light from deep space." kr="그것은 심지어 우주 먼지나 성운도 뚫어 볼 수 있는데, 그것들은 깊은 우주에서<span style='left:-130px'>오는 가시광선을 가로막습니다.</span>"></script-cont>
					<script-cont scrollTop="2729" src="../media/mp3/3_124_read_08.mp3" en="After the JWST takes photos, it sends them to scientists who study the universe." kr="JWST는<span style='left:-1017px'>사진을 찍은 후에, 우주를 연구하는 과학자들에게 그것들을 보내 줍니다.</span>"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="2729" src="../media/mp3/3_125_read_01.mp3" en="Scientists use the JWST to observe and investigate deep space." kr="과학자들은 깊은 우주를 관측하고 연구하기 위해 JWST를 사용하는군요."></script-cont>
					<script-cont scrollTop="2729" src="../media/mp3/3_125_read_02.mp3" en="Why is exploring deep space important?" kr="깊은 우주를 탐사하는 것이 왜 중요한가요?"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="3269" src="../media/mp3/3_125_read_03.mp3" en="Exploring deep space allows us to study the beginning of the early universe, and find planets with life." kr="깊은 우주를 탐사하는 것은 우리가 초기 우주의 시작을 연구하고, 생명이 있는 행성을<span style='left:-20px'>찾을 수 있게 해 줍니다.</span>"></script-cont>
					<script-cont scrollTop="3269" src="../media/mp3/3_125_read_04.mp3" en="Observing stars in deep space is like looking back in time with a time machine." kr="깊은 우주의<span style='left:-907px'>별들을 관측하는 것은 타임머신으로 시간을 되돌아보는 것과 같습니다.</span>"></script-cont>
					<script-cont scrollTop="3269" src="../media/mp3/3_125_read_05.mp3" en="Space is so large, and light from stars takes a very long time to get to Earth." kr="우주는 매우 크고, 별빛이 지구에 도달하는 데에는 매우 오랜 시간이<span style='left:-195px'>걸립니다.</span>"></script-cont>
					<script-cont scrollTop="3669" src="../media/mp3/3_125_read_06.mp3" en="So, when you look at those stars, you see them as they were a long time ago — even billions of years ago!" kr="그래서 당신이 그 별들을 볼 때, 당신은<span style='left:-609px'>오래전, 심지어 수십억 년 전의 그 별들의 모습을 보고 있는 것입니다!</span>"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="3669" src="../media/mp3/3_125_read_07_1.mp3" en="Studying deep space will help scientists solve the mysteries of the universe." kr="깊은 우주를 연구하는 것은 과학자들이 우주의 신비를 푸는 것을 도울 것입니다."></script-cont>
					<script-cont scrollTop="4089" src="../media/mp3/3_125_read_08.mp3" en="I wonder whether there is a planet like Earth in space." kr="저는 우주에 지구와 같은 행성이 있을지<span style='left:-533px'>궁금합니다.</span>"></script-cont>
					<script-cont scrollTop="4089" src="../media/mp3/3_125_read_09.mp3" en="If I were an astronaut, I would like to visit that planet." kr="만약 제가 우주 비행사라면, 그 행성에 가 보고<span style='left:-529px'>싶을 텐데요.</span>"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="4089" src="../media/mp3/3_125_read_10.mp3" en="The JWST might help us find that planet someday." kr="JWST가 언젠가 그런 행성을 찾도록 도와줄지도 모릅니다."></script-cont>
					<script-cont scrollTop="4391" src="../media/mp3/3_125_read_11.mp3" en="It’s like a bridge between the past, the present, and the future." kr="그것은<span style='left:-1040px'>과거, 현재, 그리고 미래 사이의 다리와 같습니다.</span>"></script-cont>
					<script-cont scrollTop="4391" src="../media/mp3/3_125_read_12.mp3" en="With this telescope, we are taking one step closer to understanding the mysteries of the universe." kr="이 망원경으로, 우리는 우주의 신비를 이해하는 데 한 걸음 더 다가가고<span style='left:-147px'>있습니다.</span>"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="4391" src="../media/mp3/3_125_read_13.mp3" en="Thank you, Dr. Roman." kr="감사합니다, Roman 박사님."></script-cont>
				</comp-script-box>
							</div>
						</div>
					</div>
				</div>

				<!-- btnHandlerBox -->
				<div class="btnHandlerBox selected" data-include="player">
					<div class="btnBundle">
						<div class="js-controlBox controlsBox" data-disabled="false">
							<div class="js-controlBoxContainer mediaControl" data-ply-type="language" data-ply-idx="2"></div>
						</div>

						<div class="scrollMoveBtnBox">
							<button class="js-scrollMoveBtn scrollMoveBtn ON" data-script-idx="0,35">
								<span>전체</span>
							</button>
							<button class="js-scrollMoveBtn scrollMoveBtn" data-script-idx="5,35">
								<span>123~125쪽</span>
							</button>
							<button class="js-scrollMoveBtn scrollMoveBtn" data-script-idx="15,35">
								<span>124~125쪽</span>
							</button>
							<button class="js-scrollMoveBtn scrollMoveBtn" data-script-idx="23,35">
								<span>125쪽</span>
							</button>
						</div>
					</div>

					<div class="btnBundle">
						<button class="js-korScriptBtn korScriptBtn" data-ply-idx="2"></button>
					</div>
				</div>
			</div>
		</div>

		<!-- 알럿창 -->
		<div class="resetAlert js-resetAlert">
			<div class="resetBox">
				<p>리셋하고 기록하세요.</p>
				<button class="js-timeReset timeResetBtn"></button>
			</div>
		</div>
