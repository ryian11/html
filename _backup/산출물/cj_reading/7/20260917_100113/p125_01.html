<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">

  <link rel="stylesheet" href="include/contentsUI/css/index.css">
  <link rel="stylesheet" href="include/css/common.css">
  <link rel="stylesheet" href="include/css/reading.css">
  <link rel="stylesheet" href="css/p125_01.css">

  <title>p125_01</title>
</head>
<body>
  <div id="wrap" class="js-scale" data-snd-ctl="true">
    <div id="container" data-use="read">
      <div class="js-scrollContainer scrollContainer mainContent" data-style="custom" data-scroll-idx="0">
        <div class="js-scrollBox scrollBox readingBox" data-scroll-idx="0">
          <div class="js-player Player js-selectChangePlayer readingCont" data-ply-type="language" data-ply-idx="1" data-ply-controls="play, pause, stop, progress" data-ply-opts="speed, again" data-speed-btn="0.8,1.0,1.2,1.5" data-ply-mode="basic">
            <div class="readingBtnBox Top">
              <div class="btnBox">
                <button class="js-openPopBtn videoPopBtn" data-pop-idx="1"></button>
              </div>

              <div class="btnBox">
                <button class="js-openPopBtn listenTotalBtn" data-pop-idx="2"></button>
                <button class="js-bgCover bgCoverBtn" data-ply-idx="1"></button>
              </div>
            </div>
            <div class="js-languageContainer languageContainer js-readHide" data-ply-idx="1">
              <div class="ParagraphBox">
                <!-- Paragraph -->
                <div class="Paragraph mic">
                  <comp-language-target src="media/mp3/3_125_read_01.mp3" text="|1|Scientists use the JWST to observe and [mark:1: investigate] deep space."></comp-language-target>
                  <comp-language-target src="media/mp3/3_125_read_02.mp3" text="Why is exploring deep space important?"></comp-language-target>
                </div>
                <!-- Paragraph -->
                <div class="Paragraph spk">
                  <comp-language-target scrollTop="504" src="media/mp3/3_125_read_03.mp3" text="|2|Exploring deep space [mark:2: allows] us to study the beginning of the early universe, and find planets with life."></comp-language-target>
                  <comp-language-target scrollTop="504" src="media/mp3/3_125_read_04.mp3" text="Observing stars in deep space is like looking back in time with a [mark:3: time machine]."></comp-language-target>
                  <comp-language-target scrollTop="504" src="media/mp3/3_125_read_05.mp3" text="Space is so large, and light from stars takes a very long time to get to Earth."></comp-language-target>
                  <comp-language-target scrollTop="939" src="media/mp3/3_125_read_06.mp3" text="So, when you look at those stars, you see them as they were a long time ago — even billions of years ago!"></comp-language-target>
                </div>
                <!-- Paragraph -->
                <div class="Paragraph mic">
                  <comp-language-target scrollTop="939" src="media/mp3/3_125_read_07_1.mp3" text="|3|Studying deep space will help scientists solve the mysteries of the universe."></comp-language-target>
                  <comp-language-target scrollTop="939" src="media/mp3/3_125_read_08.mp3" text="I wonder whether there is a planet like Earth in space."></comp-language-target>
                  <comp-language-target scrollTop="939" src="media/mp3/3_125_read_09.mp3" text="|4|If I were an astronaut, I would like to visit that planet."></comp-language-target>
                </div>
                <!-- Paragraph -->
                <div class="Paragraph spk">
                  <comp-language-target scrollTop="1495" src="media/mp3/3_125_read_10.mp3" text="The JWST might help us find that planet someday."></comp-language-target>
                  <comp-language-target scrollTop="1495" src="media/mp3/3_125_read_11.mp3" text="It’s like a bridge between the past, the present, and the future."></comp-language-target>
                  <comp-language-target scrollTop="1495" src="media/mp3/3_125_read_12.mp3" text="With this telescope, we are taking one step closer to understanding the mysteries of the universe."></comp-language-target>
                </div>
                <!-- Paragraph -->
                <div class="Paragraph mic">
                  <comp-language-target scrollTop="1495" src="media/mp3/3_125_read_13.mp3" text="Thank you, Dr. Roman."></comp-language-target>
                </div>
              </div>
            </div>

            <div class="js-languageContainer languageContainer js-readShow" data-ply-idx="1"></div>

            <div class="readingBtnBox Bot direcR">
              <div class="btnBox">
                <button class="js-openPopBtn questionBtn" data-pop-idx="9">
                  <span>Q4</span>
                </button>
                <button class="js-openPopBtn missionClearBtn" data-pop-idx="10"></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 영상 팝업 -->
    <div class="js-popupContent popup" data-pop-idx="1" data-use="video">
      <div class="popContentContainer">
        <div class="js-player Player js-selectChangePlayer" data-ply-type="video" data-ply-idx="2" data-ply-controls="play, pause, stop, progress, zoom" data-ply-opts="speed, again" data-speed-btn="0.8,1.0,1.2,1.5" data-ply-mode="basic" data-script-mode="bg">
          <video data-name="ON" class="js-media" playsinline="" preload="none">
            <source src="media/mp4/l7_read_script.mp4" type="video/mp4">
            <track kind="captions" src="media/mp4/l7_read.vtt" srclang="en" label="English">
          </video>
          <video data-name="OFF" class="js-media" playsinline="" preload="none">
            <source src="media/mp4/l7_read.mp4" type="video/mp4">
            <track kind="captions" src="media/mp4/l7_read.vtt" srclang="en" label="English">
          </video>
        </div>

        <button class="js-closePopBtn closePopBtn"></button>
      </div>
    </div>

    <!-- 본문 전체 듣기 팝업 -->
    <div class="js-popupContent popup Iframe" data-pop-idx="2">
      <iframe src="popup/p122_02_all.html" frameborder="0"></iframe>
      <button class="js-closePopBtn closePopBtn"></button>
    </div>

    <!-- 해석 팝업 -->
    <div class="js-popupContent popup Iframe" data-pop-idx="3">
      <iframe src="popup/p125_01_kor1.html" frameborder="0"></iframe>
      <button class="js-closePopBtn closePopBtn"></button>
    </div>

    <!-- dictation 팝업 -->
    <div class="js-popupContent popup Iframe" data-pop-idx="4">
      <iframe src="popup/p125_01_dic1.html" frameborder="0"></iframe>
      <button class="js-closePopBtn closePopBtn"></button>
    </div>

    <!-- 구문 해설 -->
    <comp-syntax></comp-syntax>

    <!-- 미니 단어장 -->
    <comp-mini-word></comp-mini-word>

    <!-- readingQuiz 팝업 -->
    <div class="js-popupContent popup" data-pop-idx="9" data-use="readingQuiz" data-pop-opts="noClose">
      <div class="popContentContainer">
        <!-- popHeader -->
        <header class="popHeader">
          <div class="popHeaderInner">
            <strong class="popHeaderTit"></strong>
          </div>
          <button class="js-closePopBtn closePopBtn"></button>
        </header>

        <!-- popContent -->
        <div class="popContent">
          <!-- quizBox -->
          <div class="js-quizContainer quizBox arrayV" data-quiz-type="choice" data-quiz-name="trueFalse" data-quiz-opts="noAlert, noSound, noSolve, noRemoveSpace, toggleChoice, noReset">
            <!-- quizTitBox -->
            <div class="quizTitBox">
              <span class="marker read">Q4</span>
              <div class="readingQuestion" data-include="interpretText">
                <p class="js-narrationBtn narrText" data-narr-idx="3" data-narr-src="media/mp3/3_125_question_02.mp3">Light from stars takes a short time to get to Earth.</p>
                <span class="js-interpretTarget interpretText" data-interpret-idx="1">해석x</span>
              </div>

              <!-- quizItem -->
              <div class="js-quizItem quizItem arrayH" data-answer="1">
                <!-- true -->
                <div class="Choice">
                  <input type="checkbox" id="quiz1_check1">
                  <label for="quiz1_check1" class="js-choiceItem choiceItem">
                    <strong>T</strong>
                  </label>
                </div>
                <!-- false -->
                <div class="Choice">
                  <input type="checkbox" id="quiz1_check2">
                  <label for="quiz1_check2" class="js-choiceItem choiceItem">
                    <strong>F</strong>
                  </label>
                </div>
                <button class="js-quizHandlerItemBtn itemBtn answer Circle" data-item-index="0" data-handler="0"></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- missionclear 팝업 -->
    <div class="js-popupContent popup" data-pop-idx="10" data-use="missionclear">
      <div class="popContentContainer">
        <!-- popHeader -->
        <header class="popHeader">
          <div class="popHeaderInner">
            <strong class="js-narrationBtn narrText popHeaderTit" data-narr-idx="7" data-narr-src="include/media/common/mission_clear.mp3"></strong>
          </div>
          <button class="js-closePopBtn closePopBtn"></button>
        </header>

        <!-- popContent -->
        <div class="popContent">
          <div class="selfCheckBox">
            <div class="checkList">
              <div class="listTxt">
                <comp-translate kr="해석x" en="Did reading the text with pictures related to the James Webb Space Telescope help you understand it?" src="media/mp3/3_125_mission_01.mp3" narrIdx="3" clickIdx="1"></comp-translate>
              </div>
            </div>
            <comp-self-check id="01,02,03" name="check01"></comp-self-check>
          </div>
        </div>
      </div>
    </div>

    <!-- 하단 버튼 -->
    <div class="botEleBox">
      <!-- main -->
      <div class="js-btnHandler btnHandlerBox selected" data-include="player" data-cont-type="main">
        <div class="btnBundle">
          <div class="js-controlBox controlsBox">
            <div class="js-controlBoxContainer mediaControl" data-ply-type="language" data-ply-idx="1"></div>
          </div>

          <button class="js-repeatTalk repeatReadBtn"></button>
          <button class="js-openPopBtn korBtn" data-pop-idx="3"></button>
          <button class="js-openPopBtn dictationBtn" data-pop-idx="4"></button>
          <button class="js-readHideBtn readHideBtn" data-ply-idx="1"></button>
        </div>
      </div>

      <!-- popup -->
      <div class="js-btnHandler btnHandlerBox" data-include="player" data-cont-type="popup" data-pop-idx="1">
        <div class="btnBundle">
          <div class="controlsBox">
            <div class="js-controlBoxContainer mediaControl" data-ply-type="video" data-ply-idx="2"></div>
          </div>

          <button class="js-repeatTalk repeatReadBtn"></button>
        </div>
      </div>

      <!-- popup -->
      <div class="js-btnHandler btnHandlerBox" data-cont-type="popup" data-pop-idx="9">
        <div class="btnBundle">
          <comp-btn-group hdlQuiz="0"></comp-btn-group>
          <button class="js-sndEffect js-interpretItem korBtn" data-snd="click" data-interpret-idx="1"></button>
        </div>
      </div>
    </div>
  </div>
  <script src="include/contentsUI/js/config.js"></script>
  <script src="include/contentsUI/js/index.js"></script>
  <script src="include/contentsUI/js/contentUI.js"></script>
  <script src="include/js/config.js"></script>
  <script src="include/js/pageManager.js"></script>
  <script src="include/js/components.js"></script>
  <script src="include/js/common.js"></script>
  <script src="include/js/reading.js"></script>
  <script src="js/p125_01.js"></script>
</body>
</html>
