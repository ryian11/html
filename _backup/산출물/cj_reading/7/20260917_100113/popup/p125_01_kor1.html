<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
  <link rel="stylesheet" href="../include/contentsUI/css/index.css">
  <link rel="stylesheet" type="text/css" href="../include/css/common.css">

  <title>p125_01_kor1</title>
  <style>
    /* 인덴트 */
    .scriptContainer .scriptBox:not(.titBox, .subTitBox, .list) .Script:first-of-type {margin-left: 20px;}
  </style>
</head>
<body>
  <div class="js-scale iframePopup" data-use="kor">
    <div class="popContentContainer">
      <!-- popHeader -->
      <header class="popHeader">
        <div class="popHeaderInner">
          <h2 class="popHeaderTit">
            <span>해석</span>
          </h2>
        </div>
        <button class="js-closePopBtn closePopBtn"></button>
      </header>
      <!-- popContentBox -->
      <div class="popContentBox">
        <!-- popContent -->
        <div class="js-scrollContainer scrollContainer popContent" data-scroll-idx="1">
          <div class="js-player Player js-scrollBox scrollBox" data-ply-type="language" data-ply-idx="1" data-scroll-idx="1">
            <!-- scriptContainer -->
            <div class="js-languageContainer scriptContainer" data-ply-idx="1">
              <!-- Paragraph -->
              <div class="Paragraph">
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont src="../media/mp3/3_125_read_01.mp3" en="Scientists use the JWST to observe and investigate deep space." kr="과학자들은 깊은 우주를 관측하고 연구하기 위해 JWST를 사용하는군요."></script-cont>
					<script-cont src="../media/mp3/3_125_read_02.mp3" en="Why is exploring deep space important?" kr="깊은 우주를 탐사하는 것이 왜 중요한가요?"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont src="../media/mp3/3_125_read_03.mp3" en="Exploring deep space allows us to study the beginning of the early universe, and find planets with life." kr="깊은 우주를 탐사하는 것은 우리가 초기 우주의 시작을 연구하고, 생명이 있는 행성을<span style='left:-20px'>찾을 수 있게 해 줍니다.</span>"></script-cont>
					<script-cont src="../media/mp3/3_125_read_04.mp3" en="Observing stars in deep space is like looking back in time with a time machine." kr="깊은 우주의<span style='left:-907px'>별들을 관측하는 것은 타임머신으로 시간을 되돌아보는 것과 같습니다.</span>"></script-cont>
					<script-cont scrollTop="529" src="../media/mp3/3_125_read_05.mp3" en="Space is so large, and light from stars takes a very long time to get to Earth." kr="우주는 매우 크고, 별빛이 지구에 도달하는 데에는 매우 오랜 시간이<span style='left:-195px'>걸립니다.</span>"></script-cont>
					<script-cont scrollTop="529" src="../media/mp3/3_125_read_06.mp3" en="So, when you look at those stars, you see them as they were a long time ago — even billions of years ago!" kr="그래서 당신이 그 별들을 볼 때, 당신은<span style='left:-609px'>오래전, 심지어 수십억 년 전의 그 별들의 모습을 보고 있는 것입니다!</span>"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="949" src="../media/mp3/3_125_read_07_1.mp3" en="Studying deep space will help scientists solve the mysteries of the universe." kr="깊은 우주를 연구하는 것은 과학자들이 우주의 신비를 푸는 것을 도울 것입니다."></script-cont>
					<script-cont scrollTop="949" src="../media/mp3/3_125_read_08.mp3" en="I wonder whether there is a planet like Earth in space." kr="저는 우주에 지구와 같은 행성이 있을지<span style='left:-533px'>궁금합니다.</span>"></script-cont>
					<script-cont scrollTop="949" src="../media/mp3/3_125_read_09.mp3" en="If I were an astronaut, I would like to visit that planet." kr="만약 제가 우주 비행사라면, 그 행성에 가 보고<span style='left:-529px'>싶을 텐데요.</span>"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="949" src="../media/mp3/3_125_read_10.mp3" en="The JWST might help us find that planet someday." kr="JWST가 언젠가 그런 행성을 찾도록 도와줄지도 모릅니다."></script-cont>
					<script-cont scrollTop="1311" src="../media/mp3/3_125_read_11.mp3" en="It’s like a bridge between the past, the present, and the future." kr="그것은<span style='left:-1040px'>과거, 현재, 그리고 미래 사이의 다리와 같습니다.</span>"></script-cont>
					<script-cont scrollTop="1311" src="../media/mp3/3_125_read_12.mp3" en="With this telescope, we are taking one step closer to understanding the mysteries of the universe." kr="이 망원경으로, 우리는 우주의 신비를 이해하는 데 한 걸음 더 다가가고<span style='left:-147px'>있습니다.</span>"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="1311" src="../media/mp3/3_125_read_13.mp3" en="Thank you, Dr. Roman." kr="감사합니다, Roman 박사님."></script-cont>
				</comp-script-box>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
