  </style>
</head>
<body>
  <div class="js-scale iframePopup" data-use="kor">
    <div class="popContentContainer">
      <!-- popHeader -->
      <header class="popHeader">
        <div class="popHeaderInner">
          <h2 class="popHeaderTit">
            <span>해석</span>
          </h2>
        </div>
        <button class="js-closePopBtn closePopBtn"></button>
      </header>
      <!-- popContentBox -->
      <div class="popContentBox">
        <!-- popContent -->
        <div class="js-scrollContainer scrollContainer popContent" data-scroll-idx="1">
          <div class="js-player Player js-scrollBox scrollBox" data-ply-type="language" data-ply-idx="1" data-scroll-idx="1">
            <!-- scriptContainer -->
            <div class="js-languageContainer scriptContainer" data-ply-idx="1">
              <!-- Paragraph -->
              <div class="Paragraph">
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont src="../media/mp3/3_124_read_01.mp3" en="Interesting" kr="흥미롭네요."></script-cont>
					<script-cont src="../media/mp3/3_124_read_02.mp3" en="I heard that the JWST uses infrared cameras." kr="저는 JWST가 적외선 카메라를 사용한다고 들었습니다."></script-cont>
					<script-cont src="../media/mp3/3_124_read_03.mp3" en="How does it work?" kr="그것은 어떻게 작동하나요?"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont src="../media/mp3/3_124_read_04.mp3" en="Using infrared cameras is the special point of this telescope." kr="적외선 카메라를 사용하는 것이 이 망원경의 특별한 점입니다."></script-cont>
					<script-cont src="../media/mp3/3_124_read_05.mp3" en="We cannot see infrared light, but we can feel it as heat." kr="우리는 적외선을 볼 수 없지만, 우리는 그것을 열로 느낄 수 있습니다."></script-cont>
					<script-cont scrollTop="429" src="../media/mp3/3_124_read_06.mp3" en="With infrared cameras, the telescope can observe the infrared light from stars and planets far from Earth." kr="적외선 카메라로 망원경은 지구에서 멀리 떨어진 별과 행성에서 나오는<span style='left:-168px'>적외선을 관측할 수 있습니다.</span>"></script-cont>
					<script-cont scrollTop="429" src="../media/mp3/3_124_read_07.mp3" en="It can even see through space dust or space clouds, which block visible light from deep space." kr="그것은 심지어 우주 먼지나 성운도 뚫어 볼 수 있는데, 그것들은 깊은 우주에서<span style='left:-130px'>오는 가시광선을 가로막습니다.</span>"></script-cont>
					<script-cont scrollTop="429" src="../media/mp3/3_124_read_08.mp3" en="After the JWST takes photos, it sends them to scientists who study the universe." kr="JWST는<span style='left:-1017px'>사진을 찍은 후에, 우주를 연구하는 과학자들에게 그것들을 보내 줍니다.</span>"></script-cont>
				</comp-script-box>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
