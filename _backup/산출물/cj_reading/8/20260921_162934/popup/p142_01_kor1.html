				<!-- scriptBox -->
				<comp-script-box>
					<script-cont src="../media/mp3/3_142_read_01.mp3" en="One morning, Emily heard a news report on the radio." kr="어느 날 아침, Emily는 라디오에서 뉴스 보도를 들었다."></script-cont>
					<script-cont src="../media/mp3/3_142_read_02.mp3" en="Healthcare workers at a local clinic needed bikes to visit sick people." kr="한 지역 병원에서 보건 의료 종사자들이 아픈 사람들을 방문하기 위해 자전거가 필요했다."></script-cont>
					<script-cont src="../media/mp3/3_142_read_03.mp3" en="Emily looked at Big Red and smiled." kr="Emily는 Big Red를 바라보며 미소 지었다."></script-cont>
					<script-cont src="../media/mp3/3_142_read_04.mp3" en="She knew what to do." kr="그녀는<span style='left:-975px'>무엇을 해야<span style='left:0px'>할지 알았다.</span></span>"></script-cont>
					<script-cont src="../media/mp3/3_142_read_05.mp3" en="That afternoon, she offered Big Red to the clinic and felt proud that it would continue helping others." kr="그날 오후, 그녀는 Big Red를 병원에 제공했고 그것이 다른 사람들을<span style='left:-50px'>계속 돕게 된 것이 자랑스러웠다.</span>"></script-cont>
					<script-cont scrollTop="509" src="../media/mp3/3_142_read_06.mp3" en="She patted the seat and whispered, “Thanks for everything.”" kr="그녀는 자전거의 안장을 토닥거리며 “모든 것에 고마워.”라고 속삭였다."></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="509" src="../media/mp3/3_142_read_07.mp3" en="At the clinic, the bike was turned into an ambulance by adding a trailer." kr="병원에서 자전거는 트레일러를 달아 구급차로 바뀌었다."></script-cont>
					<script-cont scrollTop="509" src="../media/mp3/3_142_read_08.mp3" en="The trailer had a stretcher and a safety belt in order to keep patients safe during the ride." kr="트레일러에는 환자들을 이동 중에 안전하게 지켜기 위해 들것과<span style='left:-328px'>안전벨트가 있었다.</span>"></script-cont>
					<script-cont scrollTop="551" src="../media/mp3/3_142_read_09.mp3" en="Big Red was ready to work." kr="Big<span style='left:-1014px'>Red는 일할 준비가 되었다.</span>"></script-cont>
