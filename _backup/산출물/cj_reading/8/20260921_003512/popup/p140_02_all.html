<body>
	<div class="js-iframePopupContainer js-scale iframePopup" data-use="listenTotal">
		<div class="popContentContainer">
			<!-- popHeader -->
			<header class="popHeader">
				<div class="popHeaderInner">
					<h2 class="popHeaderTit">
						<span>본문 전체 듣기</span>
					</h2>

					<div class="btnBundle readAloudBox">
						<div class="readAloudTimer">
							<div class="js-toggleBtn timerBtnBox">
								<button class="js-timeStart timeStartBtn"></button>
								<button class="js-timeEnd timeEndBtn"></button>
							</div>

							<div class="timeBox js-timeBox">
								<span class="js-minute Min">00</span>
								<span class="Dot">:</span>
								<span class="js-second Sec">00</span>
							</div>
						</div>

						<!-- readAloud -->
						<div class="readAloudBtnBox">
							<button class="js-openPopBtn openPopBtn readAloudBtn" data-pop-idx="10"></button>
							<div class="js-popupContent miniPopup" data-pop-idx="10" data-use="readaloud">
								<div class="miniContent arrayV">
									<div class="js-timeCheck timeCheck" data-order="1">
										1st <span class="js-minute Min"></span> min. <span class="js-second Sec"></span> sec.
									</div>
									<div class="js-timeCheck timeCheck" data-order="2">
										2nd <span class="js-minute Min"></span> min. <span class="js-second Sec"></span> sec.
									</div>
									<p><span class="timeStartIcon"></span>버튼을 눌러 타이머를<br>시작/종료할 수 있습니다.</p>
								</div>
							</div>
						</div>
					</div>
				</div>
				<button class="js-closePopBtn closePopBtn"></button>
			</header>

			<!-- popContentBox -->
			<div class="popContentBox">
				<!-- popContent -->
				<div class="js-scrollContainer scrollContainer popContent" data-scroll-idx="0">
					<div class="js-player Player js-scrollBox scrollBox" data-ply-type="language" data-ply-controls="play, pause, stop, progress" data-ply-opts="speed" data-speed-btn="0.8,1.0,1.2,1.5" data-script-mode="toggle" data-ply-idx="2" data-scroll-idx="0">
						<!-- scriptContainer -->
						<div class="js-languageContainer scriptContainer" data-ply-idx="2">
							<!-- Paragraph -->
							<div class="Paragraph">
				<!-- titBox -->
				<comp-script-box class="titBox">
					<script-cont src="../media/mp3/3_140_read_01.mp3" en="The Red Bike" kr="빨간 자전거"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont src="../media/mp3/3_140_read_02.mp3" en="Leo had always dreamed of having a bike." kr="Leo는 늘 자전거를 갖는 것을 꿈꿔 왔었다."></script-cont>
					<script-cont src="../media/mp3/3_140_read_03.mp3" en="To make his dream come true, he spent two years saving money." kr="그의 꿈을 이루기 위해<span style='left:-866px'>그는 돈을 모으며 2년을 보냈다.</span>"></script-cont>
					<script-cont src="../media/mp3/3_140_read_04.mp3" en="He did small jobs for his neighbors, like cutting the grass and picking up leaves." kr="그는<span style='left:-1060px'>잔디를 깎거나 낙엽을 줍는 것 같은 이웃들을 위한 작은 일들을 했다.</span>"></script-cont>
					<script-cont scrollTop="429" src="../media/mp3/3_140_read_05.mp3" en="Finally, Leo was able to buy the perfect bike." kr="마침내 Leo는 완벽한 자전거를 살 수 있었다."></script-cont>
					<script-cont scrollTop="429" src="../media/mp3/3_140_read_06.mp3" en="It was a bright red bike with 18 gears." kr="그것은 18단 기어가 달린 밝은 빨간색 자전거였다."></script-cont>
					<script-cont scrollTop="429" src="../media/mp3/3_140_read_07.mp3" en="He named it Big Red." kr="그는 그것에 Big<span style='left:-869px'>Red라는<span style='left:0px'>이름을 붙였다.</span></span>"></script-cont>
					<script-cont scrollTop="429" src="../media/mp3/3_140_read_08.mp3" en="He rode Big Red everywhere." kr="그는 어디를 가든 Big Red를 타고 다녔다."></script-cont>
					<script-cont scrollTop="429" src="../media/mp3/3_140_read_09.mp3" en="The more he rode it, the more memories he made." kr="그가 그것을 많이 타면 탈수록<span style='left:-556px'>그는 더 많은 추억을<span style='left:-216px'>만들었다.</span></span>"></script-cont>
					<script-cont scrollTop="429" src="../media/mp3/3_140_read_10.mp3" en="As he grew taller, Big Red became too small for him." kr="그가 키가 커지자 Big Red는 그에게 너무<span style='left:-445px'>작아졌다.</span>"></script-cont>
					<script-cont scrollTop="829" src="../media/mp3/3_140_read_11.mp3" en="Though it was still in great condition, Leo knew it was time for a new bike." kr="그것은 여전히 좋은 상태였지만, Leo는 새<span style='left:-530px'>자전거를 탈 때가 되었다는 것을 알았다.</span>"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="829" src="../media/mp3/3_140_read_12.mp3" en="Leo decided to donate Big Red to an organization whose mission was to send bikes to people in need." kr="Leo는 도움이 필요한 사람들에게 자전거를 보내는 것이 임무인 단체에 Big Red를<span style='left:-20px'>기부하기로 결심했다.</span>"></script-cont>
					<script-cont scrollTop="829" src="../media/mp3/3_140_read_13.mp3" en="But first, Leo wanted to make Big Red look its best." kr="하지만 우선<span style='left:-910px'>Leo는 Big Red를 최고의 상태로 보이게 만들고 싶었다.</span>"></script-cont>
					<script-cont scrollTop="1249" src="../media/mp3/3_140_read_14.mp3" en="He cleaned it, oiled the chain, and changed the handlebars." kr="그는 그것을 깨끗이 닦고,<span style='left:-768px'>체인에 기름을 바르고, 손잡이를 교체했다.</span>"></script-cont>
					<script-cont scrollTop="1249" src="../media/mp3/3_140_read_15.mp3" en="He whispered, “Thank you for all the adventures.”" kr="그는 “모든 모험에 대해<span style='left:-809px'>고마워.”라고 속삭였다.</span>"></script-cont>
					<script-cont scrollTop="1249" src="../media/mp3/3_140_read_16.mp3" en="With a heavy heart, he rode Big Red to the shipping container." kr="무거운 마음으로 그는 Big Red를<span style='left:-707px'>운송 컨테이너까지 타고 갔다.</span>"></script-cont>
					<script-cont scrollTop="1249" src="../media/mp3/3_140_read_17.mp3" en="He said goodbye when the door closed." kr="문이 닫힐 때 그는 작별<span style='left:-800px'>인사를 했다.</span>"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="1769" src="../media/mp3/3_141_read_01.mp3" en="Big Red traveled to a new country." kr="Big Red는 새로운 나라로 이동했다."></script-cont>
					<script-cont scrollTop="1769" src="../media/mp3/3_141_read_02.mp3" en="It found a new home with Emily, who lived with her grandmother and helped her in the fields." kr="그것은 Emily와 함께 하는<span style='left:-723px'>새로운 집을 찾았는데, Emily는 할머니와 함께 살며 밭일을 도왔다.</span>"></script-cont>
					<script-cont scrollTop="1769" src="../media/mp3/3_141_read_03.mp3" en="Thanks to Big Red, Emily could ride to scare birds away from the fields and go to the market to sell goods." kr="Big Red 덕분에 Emily는 밭에서 새를 쫓기 위해 자전거를<span style='left:-338px'>타고 물건을 팔러 시장에 갈 수 있었다.</span>"></script-cont>
					<script-cont scrollTop="1769" src="../media/mp3/3_141_read_04.mp3" en="She also rode Big Red to school every day." kr="그녀는 또한 매일 Big Red를 타고 학교에 갔다."></script-cont>
					<script-cont scrollTop="2169" src="../media/mp3/3_141_read_05.mp3" en="But more than anything, riding the bike gave her a quiet joy." kr="그러나<span style='left:-1088px'>무엇보다 자전거를 타는 것은 그녀에게 조용한 기쁨을 주었다.</span>"></script-cont>
					<script-cont scrollTop="2169" src="../media/mp3/3_141_read_06.mp3" en="She felt the wind on her face and began to dream of a bigger world." kr="그녀는 바람이 얼굴을 스치는 것을 느꼈고 더 넓은 세상을 꿈꾸기 시작했다."></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="2589" src="../media/mp3/3_141_read_07.mp3" en="Then one day, Emily was given a chance to continue her studies at a school in a big city." kr="그러던 어느 날, Emily는 큰 도시의 학교에서 공부를 계속할 기회를 얻게 되었다."></script-cont>
					<script-cont scrollTop="2589" src="../media/mp3/3_141_read_08.mp3" en="She knew her journey with Big Red had come to an end." kr="그녀는 Big Red와의 여정이 끝났음을<span style='left:-642px'>알았다.</span>"></script-cont>
					<script-cont scrollTop="2589" src="../media/mp3/3_141_read_09.mp3" en="She hoped it would go to someone who truly needed it." kr="그녀는 그것이 정말로 그것을 필요로<span style='left:-683px'>하는 누군가에게 가기를 바랐다.</span>"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="2589" src="../media/mp3/3_142_read_01.mp3" en="One morning, Emily heard a news report on the radio." kr="어느 날 아침, Emily는 라디오에서 뉴스 보도를 들었다."></script-cont>
					<script-cont scrollTop="3109" src="../media/mp3/3_142_read_02.mp3" en="Healthcare workers at a local clinic needed bikes to visit sick people." kr="한 지역 병원에서 보건 의료 종사자들이 아픈 사람들을 방문하기 위해 자전거가 필요했다."></script-cont>
					<script-cont scrollTop="3109" src="../media/mp3/3_142_read_03.mp3" en="Emily looked at Big Red and smiled." kr="Emily는 Big Red를 바라보며 미소 지었다."></script-cont>
					<script-cont scrollTop="3109" src="../media/mp3/3_142_read_04.mp3" en="She knew what to do." kr="그녀는<span style='left:-975px'>무엇을 해야<span style='left:0px'>할지 알았다.</span></span>"></script-cont>
					<script-cont scrollTop="3109" src="../media/mp3/3_142_read_05.mp3" en="That afternoon, she offered Big Red to the clinic and felt proud that it would continue helping others." kr="그날 오후, 그녀는 Big Red를 병원에 제공했고 그것이 다른 사람들을<span style='left:-50px'>계속 돕게 된 것이 자랑스러웠다.</span>"></script-cont>
					<script-cont scrollTop="3509" src="../media/mp3/3_142_read_06.mp3" en="She patted the seat and whispered, “Thanks for everything.”" kr="그녀는 자전거의 안장을 토닥거리며 “모든 것에 고마워.”라고 속삭였다."></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="3509" src="../media/mp3/3_142_read_07.mp3" en="At the clinic, the bike was turned into an ambulance by adding a trailer." kr="병원에서 자전거는 트레일러를 달아 구급차로 바뀌었다."></script-cont>
					<script-cont scrollTop="3509" src="../media/mp3/3_142_read_08.mp3" en="The trailer had a stretcher and a safety belt in order to keep patients safe during the ride." kr="트레일러에는 환자들을 이동 중에 안전하게 지켜기 위해 들것과<span style='left:-328px'>안전벨트가 있었다.</span>"></script-cont>
					<script-cont scrollTop="3929" src="../media/mp3/3_142_read_09.mp3" en="Big Red was ready to work." kr="Big<span style='left:-1014px'>Red는 일할 준비가 되었다.</span>"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="3929" src="../media/mp3/3_143_read_01.mp3" en="A healthcare worker whose name was Hannah began using the bike." kr="Hannah라는 이름의 보건 의료 종사자가 그 자전거를 사용하기 시작했다."></script-cont>
					<script-cont scrollTop="4249" src="../media/mp3/3_143_read_02.mp3" en="She rode Big Red along small paths where cars couldn’t go, delivering medicines and bringing patients to the clinic." kr="그녀는 약을 배달하고 환자들을 병원으로 데려오며 자동차가 갈 수<span style='left:-306px'>없는 좁은 길을 따라 Big Red를 달렸다.</span>"></script-cont>
					<script-cont scrollTop="4249" src="../media/mp3/3_143_read_03.mp3" en="Soon it became famous for its good work, and the villagers loved it." kr="곧 그것은 그것의 좋은 일로 유명해졌고, 마을 사람들은<span style='left:-438px'>그것을 매우 좋아했다.</span>"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="4669" src="../media/mp3/3_143_read_04.mp3" en="When Hannah took on a new role in another town, she rode Big Red for the last time." kr="Hannah가 다른 마을에서 새 역할을 맡게 되었을 때, 그녀는 마지막으로 Big Red를<span style='left:-20px'>탔다.</span>"></script-cont>
					<script-cont scrollTop="4669" src="../media/mp3/3_143_read_05.mp3" en="She whispered “Thank you,”" kr="그녀는 그것의 여정이 어디서 처음<span style='left:-611px'>시작되었는지<span style='left:0px'>궁금해하며 “고마워.”라고 속삭였다.</span></span>"></script-cont>
					<script-cont scrollTop="4669" src="../media/mp3/3_143_read_06.mp3" en="wondering where its journey had first begun." kr="해석x"></script-cont>
					<script-cont scrollTop="4669" src="../media/mp3/3_143_read_07.mp3" en="There was no hint that a girl had once ridden it to the market or that a boy had ridden it around a small town." kr="한<span style='left:-547px'>소녀가 한때 그것을 시장에 타고 갔다는 흔적 또는<span style='left:-489px'>한 소년이 작은 마을을 돌아다녔다는 흔적도 없었다.</span></span>"></script-cont>
					<script-cont scrollTop="4851" src="../media/mp3/3_143_read_08.mp3" en="But they remembered Big Red, and Hannah would, too." kr="그러나 그들은 Big<span style='left:-907px'>Red를 기억했고, Hannah 역시 그럴 것이다.</span>"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="4851" src="../media/mp3/3_143_read_09.mp3" en="Adapted from The Red Bicycle" kr="해석x"></script-cont>
					<script-cont scrollTop="4851" src="../media/mp3/3_143_read_10.mp3" en="(Jude Isabella, 2015)" kr="해석x"></script-cont>
				</comp-script-box>
							</div>
						</div>
					</div>
				</div>

				<!-- btnHandlerBox -->
				<div class="btnHandlerBox selected" data-include="player">
					<div class="btnBundle">
						<div class="js-controlBox controlsBox" data-disabled="false">
							<div class="js-controlBoxContainer mediaControl" data-ply-type="language" data-ply-idx="2"></div>
						</div>

						<div class="scrollMoveBtnBox">
							<button class="js-scrollMoveBtn scrollMoveBtn ON" data-script-idx="0,44">
								<span>전체</span>
							</button>
							<button class="js-scrollMoveBtn scrollMoveBtn" data-script-idx="17,44">
								<span>141~143쪽</span>
							</button>
							<button class="js-scrollMoveBtn scrollMoveBtn" data-script-idx="26,44">
								<span>142~143쪽</span>
							</button>
							<button class="js-scrollMoveBtn scrollMoveBtn" data-script-idx="35,44">
								<span>143쪽</span>
							</button>
						</div>
					</div>

					<div class="btnBundle">
						<button class="js-korScriptBtn korScriptBtn" data-ply-idx="2"></button>
					</div>
				</div>
			</div>
		</div>

		<!-- 알럿창 -->
		<div class="resetAlert js-resetAlert">
			<div class="resetBox">
				<p>리셋하고 기록하세요.</p>
				<button class="js-timeReset timeResetBtn"></button>
			</div>
		</div>
	</div>
