  </style>
</head>
<body>
  <div class="js-scale iframePopup" data-use="kor">
    <div class="popContentContainer">
      <!-- popHeader -->
      <header class="popHeader">
        <div class="popHeaderInner">
          <h2 class="popHeaderTit">
            <span>해석</span>
          </h2>
        </div>
        <button class="js-closePopBtn closePopBtn"></button>
      </header>
      <!-- popContentBox -->
      <div class="popContentBox">
        <!-- popContent -->
        <div class="js-scrollContainer scrollContainer popContent" data-scroll-idx="1">
          <div class="js-player Player js-scrollBox scrollBox" data-ply-type="language" data-ply-idx="1" data-scroll-idx="1">
            <!-- scriptContainer -->
            <div class="js-languageContainer scriptContainer" data-ply-idx="1">
              <!-- Paragraph -->
              <div class="Paragraph">
				<!-- titBox -->
				<comp-script-box class="titBox">
					<script-cont src="../media/mp3/3_140_read_01.mp3" en="The Red Bike" kr="빨간 자전거"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont src="../media/mp3/3_140_read_02.mp3" en="Leo had always dreamed of having a bike." kr="Leo는 늘 자전거를 갖는 것을 꿈꿔 왔었다."></script-cont>
					<script-cont src="../media/mp3/3_140_read_03.mp3" en="To make his dream come true, he spent two years saving money." kr="그의 꿈을 이루기 위해<span style='left:-866px'>그는 돈을 모으며 2년을 보냈다.</span>"></script-cont>
					<script-cont src="../media/mp3/3_140_read_04.mp3" en="He did small jobs for his neighbors, like cutting the grass and picking up leaves." kr="그는<span style='left:-1060px'>잔디를 깎거나 낙엽을 줍는 것 같은 이웃들을 위한 작은 일들을 했다.</span>"></script-cont>
					<script-cont scrollTop="429" src="../media/mp3/3_140_read_05.mp3" en="Finally, Leo was able to buy the perfect bike." kr="마침내 Leo는 완벽한 자전거를 살 수 있었다."></script-cont>
					<script-cont scrollTop="429" src="../media/mp3/3_140_read_06.mp3" en="It was a bright red bike with 18 gears." kr="그것은 18단 기어가 달린 밝은 빨간색 자전거였다."></script-cont>
					<script-cont scrollTop="429" src="../media/mp3/3_140_read_07.mp3" en="He named it Big Red." kr="그는 그것에 Big<span style='left:-869px'>Red라는<span style='left:0px'>이름을 붙였다.</span></span>"></script-cont>
					<script-cont scrollTop="429" src="../media/mp3/3_140_read_08.mp3" en="He rode Big Red everywhere." kr="그는 어디를 가든 Big Red를 타고 다녔다."></script-cont>
					<script-cont scrollTop="429" src="../media/mp3/3_140_read_09.mp3" en="The more he rode it, the more memories he made." kr="그가 그것을 많이 타면 탈수록<span style='left:-556px'>그는 더 많은 추억을<span style='left:-216px'>만들었다.</span></span>"></script-cont>
					<script-cont scrollTop="429" src="../media/mp3/3_140_read_10.mp3" en="As he grew taller, Big Red became too small for him." kr="그가 키가 커지자 Big Red는 그에게 너무<span style='left:-445px'>작아졌다.</span>"></script-cont>
					<script-cont scrollTop="429" src="../media/mp3/3_140_read_11.mp3" en="Though it was still in great condition, Leo knew it was time for a new bike." kr="그것은 여전히 좋은 상태였지만, Leo는 새<span style='left:-530px'>자전거를 탈 때가 되었다는 것을 알았다.</span>"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="1049" src="../media/mp3/3_140_read_12.mp3" en="Leo decided to donate Big Red to an organization whose mission was to send bikes to people in need." kr="Leo는 도움이 필요한 사람들에게 자전거를 보내는 것이 임무인 단체에 Big Red를<span style='left:-20px'>기부하기로 결심했다.</span>"></script-cont>
					<script-cont scrollTop="1049" src="../media/mp3/3_140_read_13.mp3" en="But first, Leo wanted to make Big Red look its best." kr="하지만 우선<span style='left:-910px'>Leo는 Big Red를 최고의 상태로 보이게 만들고 싶었다.</span>"></script-cont>
					<script-cont scrollTop="1049" src="../media/mp3/3_140_read_14.mp3" en="He cleaned it, oiled the chain, and changed the handlebars." kr="그는 그것을 깨끗이 닦고,<span style='left:-768px'>체인에 기름을 바르고, 손잡이를 교체했다.</span>"></script-cont>
					<script-cont scrollTop="1049" src="../media/mp3/3_140_read_15.mp3" en="He whispered, “Thank you for all the adventures.”" kr="그는 “모든 모험에 대해<span style='left:-809px'>고마워.”라고 속삭였다.</span>"></script-cont>
					<script-cont scrollTop="1049" src="../media/mp3/3_140_read_16.mp3" en="With a heavy heart, he rode Big Red to the shipping container." kr="무거운 마음으로 그는 Big Red를<span style='left:-707px'>운송 컨테이너까지 타고 갔다.</span>"></script-cont>
					<script-cont scrollTop="1171" src="../media/mp3/3_140_read_17.mp3" en="He said goodbye when the door closed." kr="문이 닫힐 때 그는 작별<span style='left:-800px'>인사를 했다.</span>"></script-cont>
				</comp-script-box>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
