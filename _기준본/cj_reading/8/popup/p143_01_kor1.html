					<script-cont src="../media/mp3/3_143_read_01.mp3" en="A healthcare worker whose name was Hannah began using the bike." kr="Hannah라는 이름의 보건 의료 종사자가 그 자전거를 사용하기 시작했다."></script-cont>
					<script-cont src="../media/mp3/3_143_read_02.mp3" en="She rode Big Red along small paths where cars couldn’t go, delivering medicines and bringing patients to the clinic." kr="그녀는 약을 배달하고 환자들을 병원으로 데려오며 자동차가 갈 수<span style='left:-306px'>없는 좁은 길을 따라 Big Red를 달렸다.</span>"></script-cont>
					<script-cont src="../media/mp3/3_143_read_03.mp3" en="Soon it became famous for its good work, and the villagers loved it." kr="곧 그것은 그것의 좋은 일로 유명해졌고, 마을 사람들은<span style='left:-438px'>그것을 매우 좋아했다.</span>"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="529" src="../media/mp3/3_143_read_04.mp3" en="When Hannah took on a new role in another town, she rode Big Red for the last time." kr="Hannah가 다른 마을에서 새 역할을 맡게 되었을 때, 그녀는 마지막으로 Big Red를<span style='left:-20px'>탔다.</span>"></script-cont>
					<script-cont scrollTop="529" src="../media/mp3/3_143_read_05.mp3" en="She whispered “Thank you,”" kr="그녀는 그것의 여정이 어디서 처음<span style='left:-611px'>시작되었는지<span style='left:0px'>궁금해하며 “고마워.”라고 속삭였다.</span></span>"></script-cont>
					<script-cont scrollTop="529" src="../media/mp3/3_143_read_06.mp3" en="wondering where its journey had first begun." kr="해석x"></script-cont>
					<script-cont scrollTop="529" src="../media/mp3/3_143_read_07.mp3" en="There was no hint that a girl had once ridden it to the market or that a boy had ridden it around a small town." kr="한<span style='left:-547px'>소녀가 한때 그것을 시장에 타고 갔다는 흔적 또는<span style='left:-489px'>한 소년이 작은 마을을 돌아다녔다는 흔적도 없었다.</span></span>"></script-cont>
					<script-cont scrollTop="529" src="../media/mp3/3_143_read_08.mp3" en="But they remembered Big Red, and Hannah would, too." kr="그러나 그들은 Big<span style='left:-907px'>Red를 기억했고, Hannah 역시 그럴 것이다.</span>"></script-cont>
