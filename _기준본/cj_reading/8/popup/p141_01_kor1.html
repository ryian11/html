<body>
  <div class="js-scale iframePopup" data-use="kor">
    <div class="popContentContainer">
      <!-- popHeader -->
      <header class="popHeader">
        <div class="popHeaderInner">
          <h2 class="popHeaderTit">
            <span>해석</span>
          </h2>
        </div>
        <button class="js-closePopBtn closePopBtn"></button>
      </header>
      <!-- popContentBox -->
      <div class="popContentBox">
        <!-- popContent -->
        <div class="js-scrollContainer scrollContainer popContent" data-scroll-idx="1">
          <div class="js-player Player js-scrollBox scrollBox" data-ply-type="language" data-ply-idx="1" data-scroll-idx="1">
            <!-- scriptContainer -->
            <div class="js-languageContainer scriptContainer" data-ply-idx="1">
              <!-- Paragraph -->
              <div class="Paragraph">
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont src="../media/mp3/3_141_read_01.mp3" en="Big Red traveled to a new country." kr="Big Red는 새로운 나라로 이동했다."></script-cont>
					<script-cont src="../media/mp3/3_141_read_02.mp3" en="It found a new home with Emily, who lived with her grandmother and helped her in the fields." kr="그것은 Emily와 함께 하는<span style='left:-723px'>새로운 집을 찾았는데, Emily는 할머니와 함께 살며 밭일을 도왔다.</span>"></script-cont>
					<script-cont src="../media/mp3/3_141_read_03.mp3" en="Thanks to Big Red, Emily could ride to scare birds away from the fields and go to the market to sell goods." kr="Big Red 덕분에 Emily는 밭에서 새를 쫓기 위해 자전거를<span style='left:-338px'>타고 물건을 팔러 시장에 갈 수 있었다.</span>"></script-cont>
					<script-cont src="../media/mp3/3_141_read_04.mp3" en="She also rode Big Red to school every day." kr="그녀는 또한 매일 Big Red를 타고 학교에 갔다."></script-cont>
					<script-cont scrollTop="409" src="../media/mp3/3_141_read_05.mp3" en="But more than anything, riding the bike gave her a quiet joy." kr="그러나<span style='left:-1088px'>무엇보다 자전거를 타는 것은 그녀에게 조용한 기쁨을 주었다.</span>"></script-cont>
					<script-cont scrollTop="409" src="../media/mp3/3_141_read_06.mp3" en="She felt the wind on her face and began to dream of a bigger world." kr="그녀는 바람이 얼굴을 스치는 것을 느꼈고 더 넓은 세상을 꿈꾸기 시작했다."></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="651" src="../media/mp3/3_141_read_07.mp3" en="Then one day, Emily was given a chance to continue her studies at a school in a big city." kr="그러던 어느 날, Emily는 큰 도시의 학교에서 공부를 계속할 기회를 얻게 되었다."></script-cont>
					<script-cont scrollTop="651" src="../media/mp3/3_141_read_08.mp3" en="She knew her journey with Big Red had come to an end." kr="그녀는 Big Red와의 여정이 끝났음을<span style='left:-642px'>알았다.</span>"></script-cont>
					<script-cont scrollTop="651" src="../media/mp3/3_141_read_09.mp3" en="She hoped it would go to someone who truly needed it." kr="그녀는 그것이 정말로 그것을 필요로<span style='left:-683px'>하는 누군가에게 가기를 바랐다.</span>"></script-cont>
				</comp-script-box>

            </div>
          </div>
