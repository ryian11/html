				<!-- titBox -->
				<comp-script-box class="titBox">
					<script-cont src="../media/mp3/3_152_read_00.mp3" en="Diana Dances" kr="Diana는 춤춘다"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont src="../media/mp3/3_152_read_01.mp3" en="“Good morning!”" kr="“좋은 아침이에요!”"></script-cont>
					<script-cont src="../media/mp3/3_152_read_02.mp3" en="Diana’s math teacher greeted the students." kr="Diana의 수학 선생님이 학생들에게<span style='left:-645px'>인사했다.</span>"></script-cont>
					<script-cont src="../media/mp3/3_152_read_03.mp3" en="“Today we’ll be preparing for your math test.”" kr="“오늘은 수학 시험 준비를 할 거예요.”"></script-cont>
					<script-cont src="../media/mp3/3_152_read_04.mp3" en="Diana did not like to study." kr="Diana는 공부하는 것을 좋아하지 않았다."></script-cont>
					<script-cont src="../media/mp3/3_152_read_05.mp3" en="But above all, what she did not like the most was math." kr="하지만 무엇보다도 가장 좋아하지 않는 것은 수학이었다."></script-cont>
					<script-cont scrollTop="529" src="../media/mp3/3_152_read_06.mp3" en="“If I were good at math, I would have no stress in math class.”" kr="“내가 수학을 잘한다면, 수학 시간에 스트레스가 없을 텐데.”"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="529" src="../media/mp3/3_153_read_01.mp3" en="That afternoon, Diana’s mother got bad news from the school." kr="그날 오후, Diana의 어머니는 학교에서 안 좋은 소식을 들었다."></script-cont>
					<script-cont scrollTop="529" src="../media/mp3/3_153_read_02.mp3" en="The teacher said, “Diana has been having difficulties with math." kr="선생님은 “Diana가 수학에 어려움을 겪고 있어요."></script-cont>
					<script-cont scrollTop="949" src="../media/mp3/3_153_read_03.mp3" en="She may fail her math test because she can’t solve equations.”" kr="그녀는 방정식을 풀지 못해서 수학 시험에<span style='left:-605px'>떨어질 수도 있어요.”라고 말씀하셨다.</span>"></script-cont>
					<script-cont scrollTop="949" src="../media/mp3/3_153_read_04.mp3" en="Diana’s mother decided to send Diana to the after-school program, but it didn’t help." kr="Diana의 어머니는 Diana를<span style='left:-734px'>방과 후 프로그램에 보내기로 결정했지만, 그것은 도움이 되지 않았다.</span>"></script-cont>
					<script-cont scrollTop="949" src="../media/mp3/3_153_read_05.mp3" en="Equations were like a foreign language to Diana." kr="방정식은 Diana에게 외국어 같았다."></script-cont>
					<script-cont scrollTop="949" src="../media/mp3/3_153_read_06.mp3" en="Her problem couldn’t be solved on her own." kr="그녀의 문제는 그녀 스스로의 힘으로 해결될 수 없었다."></script-cont>
					<script-cont scrollTop="1349" src="../media/mp3/3_153_read_07.mp3" en="Her mother wondered if Diana was okay." kr="그녀의<span style='left:-1024px'>어머니는 Diana가 괜찮은지 궁금했다.</span>"></script-cont>
					<script-cont scrollTop="1349" src="../media/mp3/3_153_read_08.mp3" en="They went to see a counselor." kr="그들은 상담사를 만나러 갔다."></script-cont>
					<script-cont scrollTop="1349" src="../media/mp3/3_153_read_09.mp3" en="After-school Program" kr="해석x"></script-cont>
					<script-cont scrollTop="1349" src="../media/mp3/3_153_read_10.mp3" en="Counselor's Office" kr="해석x"></script-cont>
					<script-cont scrollTop="1349" src="../media/mp3/3_153_read_11.mp3" en="Diana may fail her math test because she can’t solve equations." kr="해석x"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="1349" src="../media/mp3/3_154_read_01.mp3" en="The counselor observed, listened, and said to Diana," kr="상담사는 Diana를 관찰하고 이야기를 들은 뒤 말했다."></script-cont>
					<script-cont scrollTop="1869" src="../media/mp3/3_154_read_02.mp3" en="“I’m going to talk with your mother for a moment." kr="“잠시 어머니와 이야기하고 올게요."></script-cont>
					<script-cont scrollTop="1869" src="../media/mp3/3_154_read_03.mp3" en="Wait for us here.”" kr="여기서 기다리세요.”"></script-cont>
					<script-cont scrollTop="1869" src="../media/mp3/3_154_read_04.mp3" en="As he left, he turned on the radio, which filled the room with soft music." kr="그는 자리를 떠나면서 라디오를 켰고, 그것은<span style='left:-548px'>방 안을 부드러운 음악으로 가득 채웠다.</span>"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="1869" src="../media/mp3/3_155_read_01.mp3" en="For a moment, Diana forgot where she was." kr="잠시 동안 Diana는 자신이 어디에 있는지 잊었다."></script-cont>
					<script-cont scrollTop="2189" src="../media/mp3/3_155_read_02.mp3" en="She not only smiled but also closed her eyes as she followed the rhythm of the music." kr="그녀는 미소를<span style='left:-902px'>지었을 뿐만 아니라, 음악의 리듬을 따르며 눈을 감기도 했다.</span>"></script-cont>
					<script-cont scrollTop="2189" src="../media/mp3/3_155_read_03.mp3" en="The music playing from the small radio made Diana feel joyful." kr="작은 라디오에서 흘러나오는 음악은 Diana를 즐겁게<span style='left:-428px'>만들었다.</span>"></script-cont>
					<script-cont scrollTop="2189" src="../media/mp3/3_155_read_04.mp3" en="Her body moved gracefully." kr="그녀의 몸은 우아하게 움직였다."></script-cont>
					<script-cont scrollTop="2189" src="../media/mp3/3_155_read_05.mp3" en="Diana’s mother watched her dancing from the door." kr="Diana의 어머니는 문가에서 그녀가 춤추고 있는 것을 지켜보았다."></script-cont>
					<script-cont scrollTop="2589" src="../media/mp3/3_155_read_06.mp3" en="She had never seen her daughter move like that before!" kr="그녀는<span style='left:-1051px'>전에 딸이 이렇게 움직이는 모습을 본 적이 없었다!</span>"></script-cont>
					<script-cont scrollTop="2589" src="../media/mp3/3_155_read_07.mp3" en="The counselor coughed a little, then said, “Your daughter is fine." kr="상담사가<span style='left:-1042px'>약간 기침을 한 뒤 말했다. “당신의 딸은 괜찮아요.</span>"></script-cont>
					<script-cont scrollTop="2589" src="../media/mp3/3_155_read_08.mp3" en="Your daughter is a dancer!" kr="당신의 딸은 댄서예요!"></script-cont>
					<script-cont scrollTop="2589" src="../media/mp3/3_155_read_09.mp3" en="I recommend taking her to dance class.”" kr="그녀를 댄스 수업에<span style='left:-885px'>보내는 것을 추천합니다.”</span>"></script-cont>
					<script-cont scrollTop="2989" src="../media/mp3/3_155_read_10.mp3" en="“Am I a dancer?” thought Diana." kr="“내가 댄서라고?” Diana는 생각했다."></script-cont>
					<script-cont scrollTop="2989" src="../media/mp3/3_155_read_11.mp3" en="“I’m a dancer!”" kr="“나는 댄서야!”"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="2989" src="../media/mp3/3_156_read_01.mp3" en="At dance class, there were many girls and boys whose feet never stopped moving, just like Diana." kr="댄스 수업에는 Diana처럼 발이 쉬지 않고 움직이는 소년 소녀들이 많이 있었다."></script-cont>
					<script-cont scrollTop="2989" src="../media/mp3/3_156_read_02.mp3" en="She was too excited to stay calm." kr="그녀는 너무 신이<span style='left:-874px'>나서 차분히 있을 수가 없었다.</span>"></script-cont>
					<script-cont scrollTop="3409" src="../media/mp3/3_156_read_03.mp3" en="When she started learning to dance, she felt so happy." kr="춤을 배우기 시작하자, 그녀는 매우 행복했다."></script-cont>
					<script-cont scrollTop="3409" src="../media/mp3/3_156_read_04.mp3" en="She loved the moment when she could express herself freely." kr="그녀는 자신을 자유롭게 표현할 수 있는 순간을 사랑했다."></script-cont>
					<script-cont scrollTop="3409" src="../media/mp3/3_156_read_05.mp3" en="She spent the whole week waiting for her next dance class." kr="그녀는 다음 댄스 수업을 기다리며 일주일을 보냈다."></script-cont>
					<script-cont scrollTop="3409" src="../media/mp3/3_156_read_06.mp3" en="She practiced every day at home." kr="그녀는 집에서 매일 연습했다."></script-cont>
					<script-cont scrollTop="3409" src="../media/mp3/3_156_read_07.mp3" en="She even danced while she solved math problems." kr="심지어 수학 문제를 푸는 동안에도 춤을 추었다."></script-cont>
					<script-cont scrollTop="3909" src="../media/mp3/3_156_read_08.mp3" en="She discovered that it was easier for her to solve equations when she was moving." kr="그녀는 몸을 움직이고 있을 때 방정식을 푸는 것이 더 쉽다는 것을 발견했다."></script-cont>
					<script-cont scrollTop="3909" src="../media/mp3/3_156_read_09.mp3" en="The more she moved, the better she understood math." kr="그녀가 더 많이 움직일수록, 그녀는<span style='left:-680px'>수학을 더 잘 이해했다.</span>"></script-cont>
					<script-cont scrollTop="3909" src="../media/mp3/3_156_read_10.mp3" en="She practiced dancing every day so that she could do better in math, too." kr="그녀는 수학도 더 잘하기 위해 매일<span style='left:-668px'>춤을 연습했다.</span>"></script-cont>
				</comp-script-box>
				<!-- scriptBox -->
				<comp-script-box>
					<script-cont scrollTop="3909" src="../media/mp3/3_157_read_01.mp3" en="Diana even started having a good time in math class." kr="Diana는 심지어 수학 시간도 즐기기 시작했다."></script-cont>
					<script-cont scrollTop="4429" src="../media/mp3/3_157_read_02.mp3" en="“x is three!”" kr="“x는 3이에요!”"></script-cont>
					<script-cont scrollTop="4429" src="../media/mp3/3_157_read_03.mp3" en="Diana yelled when the teacher asked for an answer to an equation." kr="선생님이 방정식 답을 물었을 때 Diana는 소리쳤다."></script-cont>
					<script-cont scrollTop="4429" src="../media/mp3/3_157_read_04.mp3" en="At night, Diana dreamed that she danced and danced, repeating her favorite dance steps over and over." kr="밤에 Diana는 가장 좋아하는<span style='left:-730px'>댄스 스텝을 계속해서 반복하며 춤을 추고 또 추는 꿈을 꾸었다.</span>"></script-cont>
					<script-cont scrollTop="4429" src="../media/mp3/3_157_read_05.mp3" en="Diana thought that maybe she would dance on a big stage someday." kr="Diana는 아마도 그녀가 언젠가<span style='left:-722px'>큰 무대에서 춤을 출 것이라고 생각했다.</span>"></script-cont>
					<script-cont scrollTop="4591" src="../media/mp3/3_157_read_06.mp3" en="Or maybe not." kr="어쩌면 아닐<span style='left:-994px'>수도 있겠지만.</span>"></script-cont>
					<script-cont scrollTop="4591" src="../media/mp3/3_157_read_07.mp3" en="Of course, she PASSED her math test." kr="물론, 그녀는 수학 시험을 통과했다."></script-cont>
					<script-cont scrollTop="4591" src="../media/mp3/3_157_read_08.mp3" en="Adapted from Diana Dances" kr="해석x"></script-cont>
					<script-cont scrollTop="4591" src="../media/mp3/3_157_read_09.mp3" en="(Luciano Lozano, 2021)" kr="해석x"></script-cont>
				</comp-script-box>
							</div>
						</div>
					</div>
